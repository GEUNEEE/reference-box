name: telegram-ingest
# cokacdir(데스크톱 봇)가 실시간 인제스트를 담당하므로 예약 실행은 끔.
# 데스크톱이 꺼져 있을 때 밀린 메시지를 수동으로 처리하려면:
#   cokacctl stop 후 Actions 탭에서 Run workflow (동시에 켜면 텔레그램 409 충돌)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: telegram-ingest
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ingest from Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then echo "TELEGRAM_BOT_TOKEN 없음 - 건너뜀"; exit 0; fi
          python3 scripts/telegram_ingest.py
      - name: Commit changes
        run: |
          git config user.name refbox-bot
          git config user.email refbox-bot@users.noreply.github.com
          git add -A
          git diff --cached --quiet || (git commit -m "refbox: telegram ingest" && git pull --rebase && git push)
