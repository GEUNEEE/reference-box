name: telegram-ingest
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: telegram-ingest
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ingest from Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then echo "TELEGRAM_BOT_TOKEN 없음 - 건너뜀"; exit 0; fi
          python3 scripts/telegram_ingest.py
      - name: Commit changes
        run: |
          git config user.name refbox-bot
          git config user.email refbox-bot@users.noreply.github.com
          git add -A
          git diff --cached --quiet || (git commit -m "refbox: telegram ingest" && git pull --rebase && git push)
